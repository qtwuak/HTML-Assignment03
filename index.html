<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 09</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f9f9f9;
        }

        .box {
            width: 500px;
            padding: 10px 20px;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: bold;
            font-family: "Times New Roman", Times, serif;
        }

        /* 1. First Box: Light blue background with a double red border */
        .box-1 {
            background-color: #add8e6; /* Light blue */
            border: 5px double #ff3b30;  /* Double red border */
        }

        /* 2. Second Box: Yellow background with a solid border and rounded corners */
        .box-2 {
            background-color: #ffff00; /* Yellow */
            border: 3px solid #0056b3;  /* Solid blue border */
            border-radius: 20px;      /* Rounded corners */
        }

        /* 3. Third Box: Green background with a dotted border */
        .box-3 {
            background-color: #3cb371; /* Medium sea green */
            border: 6px dotted #6c757d; /* Dotted gray border */
        }
    </style>
</head>
<body>

    <div class="box box-1">Hello World</div>
    <div class="box box-2">Hello World</div>
    <div class="box box-3">Hello World</div>

</body>
</html>
